<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E9F9F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>家庭收纳</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // 登录态守卫（在打包前跑，避免没登录时闪一下首页内容）。
      // 只要本地没有令牌且地址不是登录页，立刻跳到登录页 —— 不发请求，不等 JS 加载。
      (function () {
        try {
          var hasToken = !!localStorage.getItem('home_inv_token');
          var hash = location.hash || '#/';
          if (!hasToken && hash.indexOf('#/login') !== 0) {
            location.replace(location.pathname + location.search + '#/login');
          }
        } catch (e) {
          /* 隐私模式下读不到 localStorage，交给正式的守卫处理 */
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
